<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWS & Packer Test Page</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f4068, #162447);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            text-align: center;
            max-width: 500px;
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        h1 { color: #e43f5a; margin-bottom: 10px; }
        p { color: #a4b3b6; line-height: 1.6; }
        .badge {
            display: inline-block;
            background-color: #00adb5;
            color: #fff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 AWS Infrastructure Test</h1>
        <p>Congratulations! If you are seeing this page, your web server, custom AMI, or deployment pipeline is working successfully.</p>
        <div class="badge">Powered by AWS & Git</div>
    </div>
</body>
</html>
